  p.moveto(400, 350);

  //This function draws a square. The function isn't called so this code does nothing.

<!DOCTYPE html>
<html>
<head>
  <title>Turtle C - Bloem</title>
  <script src="turtle.js"></script>
</head>
<body>
  <canvas id="turtlecanvas" width="600" height="600"></canvas>

  <script>
    let t = new Turtle("turtlecanvas");

    function halveCirkel(radius) {
      
      for (let i = 0; i < 180; i++) {
        t.forward((Math.PI * radius) / 180);
        t.right(1);
      }
    }

    // Bloem tekenen
    for (let i = 0; i < 6; i++) 
      halveCirkel(50);
      t.right(120);  
      halveCirkel(50);
      t.right(60);   
    }

  </script>
</body>
</html>
